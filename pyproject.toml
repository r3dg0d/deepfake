[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deepfake"
version = "0.5.0.dev0"
description = "Linux real-time face-swap and head-animation CLI with a Quickshell control center (disclosed synthetic media)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "r3dg0d" }]
keywords = ["faceswap", "alphaface", "vfx", "synthetic-media", "cli", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "click>=8.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ui-test = ["PySide6-Essentials>=6.6"]  # renders the control center in tests without Quickshell
cuda = []  # torch/cuda installed by user for AlphaFace; not forced
insightface = ["insightface>=0.7", "onnxruntime>=1.16"]
gdown = ["gdown>=5.0"]
landmarks = ["mediapipe>=0.10.14"]  # optional accurate landmarks for alignment (Apache-2.0)
# Frame generation needs a CUDA torch build (installed by you, like AlphaFace).
framegen = ["safetensors>=0.4", "nvidia-ml-py>=12"]
experimental-head = ["scipy>=1.11", "PyYAML>=6.0"] # LivePortrait; CUDA torch installed separately

[project.scripts]
deepfake = "deepfake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfake"]

[tool.hatch.build.targets.sdist]
include = ["src/deepfake", "tests", "docs", "overlays", "scripts", "flake.nix", "flake.lock", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel.force-include]
"overlays/deepfake-preview/quickshell" = "deepfake/quickshell"
"overlays/deepfake-preview/desktop/galaxy-deepfake.svg" = "deepfake/assets/galaxy-deepfake.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not gpu'"
markers = [
  "gpu: requires CUDA and installed weights (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# compact Qt property boilerplate of the Quickshell stand-in
"tests/quickshell_shim/run.py" = ["E701", "E702", "N802"]
