[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deepfake"
version = "0.4.0"
description = "Linux real-time face-swap CLI wrapping AlphaFace research (disclosed synthetic media)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "r3dg0d" }]
keywords = ["faceswap", "alphaface", "vfx", "synthetic-media", "cli", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "click>=8.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
cuda = []  # torch/cuda installed by user for AlphaFace; not forced
insightface = ["insightface>=0.7", "onnxruntime>=1.16"]
# Face-part mask. Weights are not downloaded; point the cache at an existing ONNX.
parse = ["onnxruntime>=1.16"]
# Official Meta SAM 2 (import name sam2). Not installed by default: it depends on torch>=2.5.1.
sam2 = ["SAM-2 @ git+https://github.com/facebookresearch/sam2.git"]
gdown = ["gdown>=5.0"]
# Frame generation uses NVIDIA Optical Flow (driver) + torch CUDA.
framegen = ["nvidia-ml-py>=12"]

[project.scripts]
deepfake = "deepfake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfake"]

[tool.hatch.build.targets.sdist]
include = ["src/deepfake", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "STATUS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not gpu'"
markers = [
  "gpu: requires CUDA and installed weights (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
