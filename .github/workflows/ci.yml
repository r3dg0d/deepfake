name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          # Qt runtime libraries so the control center renders in the tests (they skip if Qt cannot start)
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -e ".[dev,ui-test]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (CPU; GPU tests are opt-in with -m gpu)
        run: pytest -q
      - name: Help smoke
        run: |
          deepfake --help
          deepfake webcam --help
          deepfake devices
          deepfake models list
          deepfake webcam --help | grep -- --frame-gen
